# =========================
# CORE SETTINGS
# =========================
set draw_borders both

set preview_images true
set preview_files true
set collapse_preview true
set wrap_scroll true

map sq shell nvim %s

# externally open images
map i shell explorer.exe "$(wslpath -w %s)"

# externally open videos via mpv
map v shell mpv.exe "$(wslpath -w %s)"

# Toggle hidden files
map zh set show_hidden!

# =========================
# NAVIGATION
# =========================
map gh cd ~/
map gp cd ~/projects/
map gc cd ~/.config/
map gH cd ~/

# Windows filesystem shortcuts (WSL)
map gd cd ~/downloads/
map gD cd ~/desktop/
map gP cd ~/pictures/
map gV cd ~/videos/

# Quick directory hopping
map .. cd ..
map ... cd ../..
map .... cd ../../..

# Dev folders (optional but useful)
#map gr cd ~/projects/rust/
#map gn cd ~/projects/node/
#map gl cd ~/projects/linux/

# =========================
# FILE OPERATIONS
# =========================

# Yank / cut / paste (vim-like consistency)
map yy yank
map dd cut
map pp paste

# Undo
map u undo
map U clear

# Rename
map r rename
map R bulkrename

# =========================
# TRASH / DELETE
# =========================

# Safe delete (trash)
map dT shell trash-put %s

# Hard delete (dangerous)
map dD shell rm -rf %s

# Confirmed delete
map dC console shell rm -ri %s

# =========================
# SEARCH / FILTER
# =========================

map / search
map n search_next
map N search_next -r

map f console filter%space

# =========================
# OPENING / EXTERNAL APPS
# =========================

# Open normally
map o open_with

# Open in default system handler
map O shell explorer.exe "$(wslpath -w %d)"

# Copy path to Windows clipboard
map yc shell echo "%d/%f" | clip.exe

# Copy Windows-formatted path
map yw shell wslpath -w "%d/%f" | clip.exe

# =========================
# UTILITY
# =========================

# Rename shortcuts consistency
map rr rename
map rR bulkrename

# Terminal spawn
map t shell $SHELL

map cx shell chmod u+x %s
map cX shell chmod u-x %s
